{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">Resume</h1>
    {{- with os.Stat "static/resume.pdf" }}
    <p class="resume-updated">Last updated {{ .ModTime.Format "January 2, 2006" }}</p>
    {{- end }}
  </header>
  <div class="resume-actions">
    <a href="/resume.pdf" download="Noah_Foster_Resume.pdf" class="resume-download">Download PDF</a>
  </div>
  <div class="resume-embed">
    <object data="/resume.pdf" type="application/pdf" width="100%" height="900">
      <p>PDF preview not supported in this browser — <a href="/resume.pdf">download the resume</a> instead.</p>
    </object>
  </div>
</article>
{{ end }}
